name: Deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run Python regression suite
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Run Node regression suite
        run: node --test tests/*.mjs
      - name: Run required privacy and accessibility browser E2E gates
        run: |
          python3 -m venv "$RUNNER_TEMP/e2e"
          "$RUNNER_TEMP/e2e/bin/pip" install --require-hashes --only-binary=:all: --disable-pip-version-check -r security/playwright-requirements.txt
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_path"
          LOTTEREAL_E2E_REQUIRED=1 LOTTEREAL_E2E_CHROME="$chrome_path" "$RUNNER_TEMP/e2e/bin/python" -B -m unittest tests.test_international_browser_e2e -v
          LOTTEREAL_E2E_CHROME="$chrome_path" "$RUNNER_TEMP/e2e/bin/python" -B tests/browser_privacy_e2e.py
      - name: Build allowlisted Pages artifact
        id: build
        run: |
          python3 scripts/build_pages_artifact.py --output "$RUNNER_TEMP/site" --manifest "$RUNNER_TEMP/pages-manifest.json" --revision "${GITHUB_SHA}"
          echo "manifest_sha256=$(sha256sum "$RUNNER_TEMP/pages-manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Scan complete Pages artifact for credentials and private data
        run: python3 scripts/scan_pages_artifact.py --artifact "$RUNNER_TEMP/site" --allowlist security/pages-artifact-allowlist.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    # PRs and manual runs on non-main refs remain build-only.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
    steps:
      - name: Check out exact deployed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Use pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact deployed revision, hashes, and health
        run: >-
          python3 scripts/verify_pages_deployment.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --expected-revision "${GITHUB_SHA}"
          --expected-manifest-sha256 "${{ needs.build.outputs.manifest_sha256 }}"
