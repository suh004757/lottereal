name: Deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Python regression suite
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Run Node regression suite
        run: node --test tests/*.mjs
      - name: Run English privacy and accessibility browser E2E
        run: |
          python3 -m venv "$RUNNER_TEMP/e2e"
          "$RUNNER_TEMP/e2e/bin/pip" install --disable-pip-version-check "playwright==1.55.0"
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_path"
          LOTTEREAL_E2E_CHROME="$chrome_path" "$RUNNER_TEMP/e2e/bin/python" -B -m unittest tests.test_international_browser_e2e -v
      - name: Build allowlisted Pages artifact
        run: python3 scripts/build_pages_artifact.py --output "$RUNNER_TEMP/site" --manifest "$RUNNER_TEMP/pages-manifest.json"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
