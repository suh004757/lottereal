<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 | 롯데부동산</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../img/core-img/favicon.ico">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/admin-login.css">
</head>
<body class="admin-login-shell">
  <main class="admin-login-main">
    <section class="admin-login-card" aria-labelledby="adminLoginTitle">
      <a class="admin-login-brand" href="../index.html" aria-label="롯데부동산 홈페이지">
        <span class="admin-login-mark" aria-hidden="true">L</span>
        <span>
          <strong>롯데부동산</strong>
          <small>LOTTE REAL ESTATE</small>
        </span>
      </a>

      <div class="admin-login-heading">
        <p class="admin-login-kicker">관리자 전용</p>
        <h1 id="adminLoginTitle">관리자 로그인</h1>
        <p id="adminLoginDescription">허용된 관리자 Google 계정으로 로그인해 주세요.</p>
      </div>

      <button
        type="button"
        id="googleLoginButton"
        class="admin-login-google"
        aria-describedby="adminLoginDescription"
        disabled>
        <svg class="admin-login-google__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.39 13.93A6.02 6.02 0 0 1 6.07 12c0-.67.12-1.32.32-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.55l3.35-2.62Z"/>
          <path fill="#EA4335" d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.63 9.63 0 0 0 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94Z"/>
        </svg>
        <span id="googleLoginButtonText">Google 계정으로 계속</span>
      </button>

      <div id="loginMessage" class="admin-login-message" role="status" aria-live="polite"></div>

      <p class="admin-login-access-note">
        <span aria-hidden="true">●</span>
        허용된 관리자 계정만 관리 화면에 접근할 수 있습니다.
      </p>

      <a class="admin-login-home" href="../index.html">홈페이지로 돌아가기</a>
    </section>
  </main>

  <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
